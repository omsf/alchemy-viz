[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "alchemy-viz"
description = "Visualization tools for gufe"
readme = "README.md"
keywords = [
  "alchemical-free-energy",
  "cheminformatics",
  "computational-chemistry",
  "gufe",
  "openfe",
  "visualization",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "The OpenFE developers", email = "openfe@omsf.io" } ]
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = [ "version" ]
# Deliberately empty, and gufe is deliberately not here.
#
# alchemy-viz is an optional companion to an openfe install, not a part of it.
# The environment it lands in already has gufe, from conda-forge. The gufe on
# PyPI is a single 0.4 release predating the 1.0 API, so a hard `gufe>=1.12`
# requirement would be unsatisfiable at resolution time and would fail the
# install for exactly the people who already have a working gufe sitting in the
# same environment. Leaving it out is what lets `pip install alchemy-viz`
# succeed into an openfe environment and bind to the gufe already there.
#
# The requirement has not disappeared, it has moved to import time:
# `alchemy_viz._gufe.require_gufe` raises with the conda-forge instruction. See
# the `gufe` extra below, and `pixi.toml`, which is what pulls the real one in
# for development.
dependencies = []
# Declarative form of the same requirement, for anyone whose resolver can
# actually reach a gufe >=1.12 - a conda-forge-backed pip, or a future PyPI
# release. `pip install alchemy-viz[gufe]` is the assertion "I expect this to be
# resolvable here"; plain `pip install alchemy-viz` makes no such claim.
optional-dependencies.gufe = [
  "gufe>=1.12",
]
# The live notebook layer. `alchemy_viz.view()` works without this, returning the
# static page. With anywidget we get update-in-place instead of the picture.
optional-dependencies.notebook = [
  "anywidget>=0.9",
]
optional-dependencies.test = [
  "jsonschema>=4",
  "pytest>=7",
]
urls.Homepage = "https://github.com/omsf/alchemy-viz"
urls.Issues = "https://github.com/omsf/alchemy-viz/issues"
scripts.alchemy-viz = "alchemy_viz.cli:main"

[tool.setuptools]
packages.find.where = [ "python" ]
# `python/tests/` has an `__init__.py`, so an unfiltered find() discovers it as a
# top-level package named `tests` and installs it into site-packages, where it
# collides with every other project that ships one. Only alchemy_viz ships.
packages.find.include = [ "alchemy_viz*" ]
packages.find.namespaces = false
package-dir = { "" = "python" }
include-package-data = true
# The Vite bundle and the HTML template are build artifacts, committed to the
# repo so `pip install .` needs no Node toolchain.
package-data.alchemy_viz = [ "_assets/*" ]
zip-safe = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py312"
line-length = 120
format.docstring-code-format = true
lint.select = [
  "F",  # Pyflakes
  "I",  # isort
  "UP", # pyupgrade
]

[tool.pytest]
ini_options.testpaths = [ "python/tests" ]
