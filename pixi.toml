[workspace]
name = "alchemy-viz"
description = "Visualization tools for gufe"
authors = ["The OpenFE developers <openfe@omsf.io>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
# Kept equal to `requires-python` in pyproject.toml. The solver still picks the
# highest version conda-forge can actually satisfy gufe and RDKit on, so
# widening this permits a newer Python rather than demanding one.
python = ">=3.12,<3.15"
nodejs = ">=24"
# This is where the real gufe comes from. It is a conda-forge package: PyPI's
# newest release is 0.4 and the 1.0 API does not exist there, which is why
# pyproject.toml declares gufe as an extra rather than a hard dependency and
# pushes the failure to import time. Development does not want that failure, so
# this table supplies the genuine article and `pixi run test` exercises the
# gufe-backed paths. The floor here and the floor in the `gufe` extra should
# agree.
gufe = ">=1.12"
rdkit = "*"
pytest = "*"
jsonschema = "*"
ruff = "*"
pre-commit = "*"
pip = "*"
python-build = ">=1.6.0,<2"
twine = ">=7.0.0,<8"

[pypi-dependencies]
alchemy-viz = { path = ".", editable = true }

# --------------------------------------------------------------------------- #
# Node                                                                          #
# --------------------------------------------------------------------------- #

[tasks.hooks]
description = "Install the git pre-commit hooks (ruff, whitespace, and nbstripout on the demo notebook)."
cmd = "pre-commit install"

[tasks.hooks-run]
description = "Run every pre-commit hook over the whole tree, not just the staged files."
cmd = "pre-commit run --all-files"

[tasks.clean]
description = "Tidy the working tree the way the commit hooks will: strip notebook outputs, apply ruff, fix whitespace and missing final newlines."
# The fixing counterpart to `hooks-run`. pre-commit exits non-zero whenever a
# hook rewrote a file, which here is the ordinary outcome rather than an error,
# so the second pass is what reports honestly: it fails only if something is
# left that no hook can fix by itself.
cmd = "pre-commit run --all-files || pre-commit run --all-files"

[tasks.npm-install]
description = "Install the Node toolchain (vite, typescript, vitest, ajv)."
cmd = "npm ci --no-audit --no-fund || npm install --no-audit --no-fund"
inputs = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Vite dev server: drop a payload JSON on the page and see it render."
cmd = "npm run dev"
depends-on = ["npm-install"]

[tasks.build]
description = "Bundle the TypeScript into python/alchemy_viz/_assets/alchemy-viz.js."
cmd = "npm run build"
depends-on = ["npm-install"]

[tasks.types]
description = "Regenerate ts/src/schema/types.ts from the JSON Schema."
cmd = "npm run types"
depends-on = ["npm-install"]

[tasks.atom-colors]
description = "Regenerate ts/src/shared/atom-colors.ts by reading gufe and matplotlib."
cmd = "python scripts/gen_atom_colors.py"

[tasks.big-network]
description = "Generate a large synthetic ligand network, to measure page size and layout cost against."
cmd = "python scripts/make_big_network.py"

[tasks.parity-reference]
description = "Render gufe's own mapping drawings, to compare our atom-mapping view against."
cmd = "python scripts/make_parity_reference.py"

[tasks.examples]
description = "Rebuild examples/*.json from real gufe objects."
cmd = "python scripts/make_examples.py"

[tasks.gallery]
description = "Rebuild the gallery notebook: headless Chrome creates screenshots from the notebook visualizations so they work in e.g. github"
cmd = "python scripts/make_gallery.py"
depends-on = ["build"]

# --------------------------------------------------------------------------- #
# Notebooks                                                                     #
# --------------------------------------------------------------------------- #
#
# A separate environment, because JupyterLab and marimo are heavyweight compared
# to the non-notebook infrastructure and nothing else here needs them.
# `pixi run notebook` still works from anywhere:
# the task exists in only one environment, so pixi picks it.

[feature.notebook.dependencies]
anywidget = ">=0.9"
# anywidget requires ipywidgets>=7.6.0 but jupyterlab >= 4 needs ipywidgets 8
ipywidgets = ">=8"
jupyterlab = ">=4"
marimo = "*"

# Node picks CommonJS or ESM by walking up from the file it is loading until it
# finds a package.json. `.pixi/` sits inside the repository and carries none of
# its own, so the first one found for anything under it is ours at the root, and
# our `"type": "module"` gets applied to third-party JavaScript that was never
# part of this package. JupyterLab ships `node-version-check.js` and
# jupyter_builder ships `yarn.js`, both CommonJS, and both then fail to load;
# JupyterLab reports the failure as "Please install nodejs", which is misleading
# because pixi has already installed one. Writing a package.json here ends our
# package at `.pixi/` and hands that subtree back to Node's default, which for a
# `.js` file with no `type` field is CommonJS.
[feature.notebook.tasks.env-module-boundary]
description = "Stop the root package.json from forcing ESM on the JavaScript vendored inside .pixi."
cmd = "echo '{ \"type\": \"commonjs\" }' > .pixi/package.json"

[feature.notebook.tasks.notebook]
description = "JupyterLab on the demo notebook: every visualization type, every delivery mode."
cmd = "jupyter lab examples/notebooks/alchemy-viz-demo.ipynb"
depends-on = ["build", "env-module-boundary"]

[feature.notebook.tasks.marimo]
# One notebook, two frontends: marimo reads the same .ipynb, converted. The
# conversion is a build artifact rather than a second copy to keep in step.
description = "The same demo, converted and opened in marimo."
cmd = """
rm -rf examples/notebooks/.marimo &&
mkdir -p examples/notebooks/.marimo &&
marimo convert examples/notebooks/alchemy-viz-demo.ipynb -o examples/notebooks/.marimo/demo.py &&
marimo edit examples/notebooks/.marimo/demo.py
"""
depends-on = ["build"]

[feature.notebook.tasks.test-notebook]
description = "pytest over the notebook layer, with anywidget installed."
cmd = "pytest python/tests/test_notebook.py -q"

[environments]
notebook = ["notebook"]

# --------------------------------------------------------------------------- #
# Rendering                                                                     #
# --------------------------------------------------------------------------- #
#
# `alchemy-viz` is a console script from pyproject.toml, so it is already on PATH
# inside this environment and `pixi run alchemy-viz ...` would work with no task at
# all. It is declared anyway, because I use 'pixi run' by default, so it's a nice
# convenience. Arguments after the task name are appended to `cmd`

[tasks.alchemy-viz]
description = "Render a payload or gufe object as one page: `pixi run alchemy-viz examples/small_molecule.json -o /tmp/mol.html`"
cmd = "python -m alchemy_viz.cli"

[tasks.alchemy-viz-debug]
description = "The same, with the payload printed to the browser console (also reachable as <url>?debug)."
cmd = "python -m alchemy_viz.cli --debug"

# --------------------------------------------------------------------------- #
# Checks                                                                        #
# --------------------------------------------------------------------------- #

[tasks.test-py]
description = "pytest - payload builders, schema validity, mutation matrix."
cmd = "pytest python/tests -q"

[tasks.test-ts]
description = "vitest - Ajv validation, mutation matrix, element lifecycle."
cmd = "npm run test"
depends-on = ["npm-install"]

[tasks.test]
description = "The whole suite, both languages."
depends-on = ["test-py", "test-ts"]

[tasks.lint]
description = "ruff (check + format), tsc --noEmit"
cmd = "ruff check python scripts && ruff format --check python scripts && npm run typecheck"
depends-on = ["npm-install"]

[tasks.format]
description = "Apply ruff's fixes and formatting."
cmd = "ruff check --fix python scripts && ruff format python scripts"

[tasks.check-generated]
description = "Fail if the committed TS types or JS bundle are stale."
cmd = "bash scripts/check_generated.sh"
depends-on = ["npm-install"]

[tasks.ci]
description = "Everything CI runs: lint, both suites, generated-artifact freshness."
depends-on = ["lint", "test-py", "test-ts", "check-generated"]

[tasks.dist]
description = "Build the sdist and wheel into dist/, and check them the way PyPI will."
# `build` first: the wheel carries the compiled bundle, so a stale bundle would
# ship. `--strict` makes twine fail on a long-description warning rather than
# letting a README that renders badly reach PyPI, where the upload cannot be
# taken back.
cmd = """
rm -rf dist &&
python -m build &&
twine check --strict dist/*
"""
depends-on = ["build"]

[tasks.dist-check]
description = "Install the built wheel into a throwaway venv with no gufe, and use it."
# What `pip install alchemy-viz` actually lands in. gufe is not on PyPI at a
# usable version, so a gufe-less environment is the ordinary case and the
# package has to import and render payloads there.
cmd = "bash scripts/check_wheel.sh"
depends-on = ["dist"]

[tasks.release]
description = "Cut and push a release tag: `pixi run release 0.1.2`. With no version, reports the current one."
# The tag is the release - publish-pypi.yml builds from it and uploads through
# trusted publishing - so the script checks what it can before the push and
# makes you type the version back. No `depends-on`: the gates that matter run in
# CI against the tagged commit, and making a report of the current version wait
# on a full build would only teach people to skip the task.
cmd = "bash scripts/release.sh"

[tasks.npm-dist]
description = "Fill npm/dist/, leaving npm/ ready for npm publish."
# `npm/` is the package: `package.json` and `README.md` are checked in and
# published as-is, so this task only fills `dist/`. We have a second package.json
# because tree-shaking would remove the functionality
#
# `build` first: a stale bundle is a stale package. The version stays 0.0.0
# here; `publish-npm.yaml` sets it from the tag, which keeps npm and PyPI in step.
cmd = "npm run build:npm"
depends-on = ["build"]

[tasks.npm-dist-check]
description = "Install the packed npm tarball into a throwaway project and compile against it."
# What `npm install alchemy-viz` actually lands in: no repository, no tsconfig
# of ours, no ambient type packages. See the header of the script.
cmd = "bash scripts/check_npm.sh"
depends-on = ["npm-dist"]
